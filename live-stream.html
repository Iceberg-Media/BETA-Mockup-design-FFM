<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="FansFollow.me Live Stream">
  <meta name="theme-color" content="#f97316">
  <title>Live Stream - FansFollow.me</title>
  <link href="https://fansfollow.me/img/favicon.png" rel="icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #111318;
      --chat-bg: #0b0f1a;
      --panel: #151b2c;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.08);
      --cta-gradient-2: linear-gradient(135deg, #f97316 0%, #9333ea 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 400; }
    a { color: inherit; text-decoration: none; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Inter', sans-serif; color: var(--text); }

    .live-room { display: flex; height: 100vh; width: 100vw; }

    .live-area { flex: 1; display: flex; align-items: center; justify-content: center; background: var(--bg); position: relative; padding: 2rem; }
    .live-center { text-align: center; max-width: 520px; }
    .live-title-row { display: flex; align-items: center; justify-content: center; gap: .7rem; margin-bottom: 1rem; }
    .live-title-row i { font-size: 2rem; color: #fb923c; }
    .live-title-row h1 { font-size: 1.75rem; font-weight: 800; color: #fff; line-height: 1.2; }
    .live-subtext { font-size: .92rem; color: var(--muted); line-height: 1.5; margin-bottom: 1.75rem; }

    .subscribe-btn { display: inline-flex; align-items: center; gap: .55rem; padding: .8rem 2rem; border-radius: 999px; background: var(--cta-gradient-2); color: #fff; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; transition: filter .18s; box-shadow: 0 10px 28px rgba(249,115,22,.28); }
    .subscribe-btn:hover { filter: brightness(1.12); }
    .subscribe-btn i { font-size: 1.05rem; }

    .home-link { display: inline-flex; align-items: center; gap: .4rem; margin-top: 1.5rem; font-size: .88rem; font-weight: 600; color: var(--muted); transition: color .18s; }
    .home-link:hover { color: #fff; }

    .chat-sidebar { width: 340px; flex-shrink: 0; background: var(--chat-bg); border-left: 1px solid var(--line); display: flex; flex-direction: column; height: 100vh; }
    .chat-header { padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .chat-header h2 { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 1rem 1.25rem; }

    .chat-input-bar { padding: .85rem 1rem; border-top: 1px solid var(--line); flex-shrink: 0; }
    .chat-input { width: 100%; padding: .7rem 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; color: #fff; font-family: inherit; font-size: .88rem; outline: none; transition: border-color .2s; }
    .chat-input::placeholder { color: #64748b; }
    .chat-input:focus { border-color: #f97316; }

    @media (max-width: 767.98px) {
      .live-room { flex-direction: column; }
      .live-area { flex: 1; min-height: 50vh; }
      .chat-sidebar { width: 100%; height: 40vh; border-left: none; border-top: 1px solid var(--line); }
      .live-title-row h1 { font-size: 1.35rem; }
      .live-title-row i { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="live-room">
    <div class="live-area">
      <div class="live-center">
        <div class="live-title-row">
          <i class="bi bi-broadcast"></i>
          <h1>Welcome to my Live room!</h1>
        </div>
        <p class="live-subtext">I am not currently online, but feel free to subscribe to receive notifications about my upcoming live streams.</p>
        <button type="button" class="subscribe-btn" onclick="alert('This is a design preview — subscribing is not functional here.');">
          <i class="bi bi-lock"></i> Subscribe now!
        </button>
        <div>
          <a href="index.html" class="home-link">
            <i class="bi bi-arrow-left"></i> Go to home page
          </a>
        </div>
      </div>
    </div>

    <aside class="chat-sidebar">
      <div class="chat-header">
        <h2>Chat</h2>
      </div>
      <div class="chat-messages"></div>
      <div class="chat-input-bar">
        <input type="text" class="chat-input" placeholder="Write something...">
      </div>
    </aside>
  </div>
</body>
</html>
